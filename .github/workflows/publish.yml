name: Publish multi-arch image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. 1.1.0)'
        required: true
        default: '1.1.0'

permissions:
  contents: read
  packages: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Install crane
        run: |
          curl -sSL -o /tmp/crane.tar.gz https://github.com/google/go-containerregistry/releases/download/v0.22.1/go-containerregistry_Linux_x86_64.tar.gz
          tar -xzf /tmp/crane.tar.gz -C /usr/local/bin crane
          crane version

      - name: Download HOOC connect images (5 platforms, x86 best-effort)
        env:
          TOKEN1: ${{ secrets.HOOC_ACCESS_TOKEN }}
          TOKEN2: ${{ secrets.HOOC_ACCESS_TOKEN2 }}
        run: |
          set -euo pipefail
          mkdir -p work && cd work
          fetch() {
            local arch="$1" out="$2"
            for tok in "$TOKEN1" "$TOKEN2"; do
              if [ -n "$tok" ] && curl -L --fail -sS -o "$out" "https://api.hooc.me/embedded-gateway/v1/binary?arch=${arch}&os=LINUX&package=DOCKER_IMAGE&access_token=${tok}"; then
                echo "fetched ${arch}: $(stat -c%s "$out") bytes"
                return 0
              fi
            done
            return 1
          }
          fetch ARM_V8 HOOC_ARM_V8.tar
          fetch ARM_V7 HOOC_ARM_V7.tar
          fetch ARM_V6 HOOC_ARM_V6.tar
          if ! fetch AMD64 HOOC_AMD64.tar; then echo "AMD64 failed to download"; exit 1; fi
          # 32-bit x86: Hooc API currently returns 422 for X86 / 486_CX8 ("Packaging as docker image failed").
          # Keep it best-effort so the index automatically gains linux/386 when upstream fixes it.
          if fetch X86 HOOC_X86.tar; then
            echo "X86 available"
            echo "X86_OK=true" >> "$GITHUB_ENV"
          else
            echo "X86 not available from Hooc yet (skipping linux/386)"
            echo "X86_OK=false" >> "$GITHUB_ENV"
          fi

      - name: Patch platform variants
        run: |
          cd work
          python3 - <<'PYEOF'
          import tarfile, json, io, os
          archmap = {
              'ARM_V8':  ('arm64', None),
              'ARM_V7':  ('arm', 'v7'),
              'ARM_V6':  ('arm', 'v6'),
              'AMD64':   ('amd64', None),
          }
          if os.path.exists('HOOC_X86.tar'):
              archmap['X86'] = ('386', None)
          for arch, (a, v) in archmap.items():
              src = f'HOOC_{arch}.tar'; dst = f'patched_{arch}.tar'
              t = tarfile.open(src, 'r')
              data = json.loads(t.extractfile('manifest.json').read())
              with tarfile.open(dst, 'w') as out:
                  for m in t.getmembers():
                      if not m.isfile():
                          out.addfile(m); continue
                      payload = t.extractfile(m).read()
                      if m.name == data[0]['config']:
                          cfg = json.loads(payload)
                          cfg['architecture'] = a
                          if v: cfg['variant'] = v
                          else: cfg.pop('variant', None)
                          payload = json.dumps(cfg, indent=2).encode()
                          m.size = len(payload)
                      out.addfile(m, io.BytesIO(payload))
              print('patched', dst)
          PYEOF

      - name: Push to ghcr.io
        env:
          REG: ghcr.io/aseracorp/hooc-connect
          V: ${{ github.event.inputs.version }}
          X86_OK: ${{ env.X86_OK }}
        run: |
          set -euo pipefail
          cd work
          crane auth login ghcr.io -u "${{ github.actor }}" --password-stdin <<< "${{ secrets.GITHUB_TOKEN }}"
          MANIFESTS=()
          crane push patched_ARM_V8.tar "$REG:arm64-$V";   MANIFESTS+=("$REG:arm64-$V")
          crane push patched_ARM_V7.tar "$REG:armv7-$V";   MANIFESTS+=("$REG:armv7-$V")
          crane push patched_ARM_V6.tar "$REG:armv6-$V";   MANIFESTS+=("$REG:armv6-$V")
          crane push patched_AMD64.tar "$REG:amd64-$V";    MANIFESTS+=("$REG:amd64-$V")
          if [ -f patched_X86.tar ] && [ "$X86_OK" = "true" ]; then
            crane push patched_X86.tar "$REG:x86-$V"
            MANIFESTS+=("$REG:x86-$V")
          fi
          ARGS=()
          for m in "${MANIFESTS[@]}"; do ARGS+=(-m "$m"); done
          echo "Building index for: ${MANIFESTS[*]}"
          crane index append --docker-empty-base "${ARGS[@]}" -t "$REG:$V"
          crane index append --docker-empty-base "${ARGS[@]}" -t "$REG:latest"

      - name: Ensure package is public
        run: |
          curl -sS -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -d '{"visibility":"public"}' \
            "https://api.github.com/orgs/aseracorp/packages/container/hooc-connect/visibility" \
            || echo "visibility update failed (may already be public)"